name: rajatani
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.0.1
  hydrated_bloc: ^11.0.0
  icons_plus_pro: ^6.0.0
  json_annotation: ^4.12.0
  loading_animation_widget: ^1.3.0
  path_provider: ^2.1.6
  pinput: ^6.0.2

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: JakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-VariableFont_wght.ttf
          style: italic
